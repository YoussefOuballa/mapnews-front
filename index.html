<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MapNews | Actualité marocaine et internationale</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/font-awesome.min.css">
        <link rel="stylesheet" href="assets/css/splide.min.css">
    
        <script src="assets/js/tailwind.min.js"></script>
        <script src="assets/js/tailwind.config.js"></script>

        <script defer src="assets/js/alpine.min.js"></script>
        
        <script defer src="assets/js/splide.min.js"></script>

        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    <body class="bg-white text-gray-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- DRUPAL REGION: Header -->
        <header x-data="{ 
                lastScroll: 0, 
                isHidden: false,
                handleScroll() {
                    let currentScroll = window.pageYOffset;
                    if (currentScroll > this.lastScroll && currentScroll > 150) {
                        this.isHidden = true;
                    } else if (currentScroll < this.lastScroll || currentScroll <= 0) {
                        this.isHidden = false;
                    }
                    this.lastScroll = currentScroll;
                }
            }"
            @scroll.window="handleScroll"
            class="fixed top-0 start-0 z-[100] w-full flex flex-col shadow-sm bg-white transition-transform duration-300 ease-in-out"
            :class="isHidden ? '-translate-y-full' : 'translate-y-0'">
        
            <!-- The Navbar -->
            <div data-include="blocks/global/header.html"></div>
            
            <!-- Breaking News -->
            <div data-include="blocks/global/breaking-news.html"></div>
            
        </header>

        <!-- DRUPAL REGION: Main Content -->
        <main class="flex-grow w-full container mx-auto px-4 sm:px-6 lg:px-8 pb-4 pt-[96px] lg:pt-[145px]" id="main-content">
            <!-- Injects the 3-column layout structure -->
            <div data-include="blocks/layouts/home-layout-top.html" class="max-w-7xl mx-auto px-0"></div>

            <div data-include="blocks/global/billboard-ad.html" class="mt-4 w-full"></div>
            
            <div data-include="blocks/layouts/home-layout-bottom.html" class="mt-4 lg:mt-8 w-full"></div>
        </main>

        <section class="w-full overflow-hidden">
            <div data-include="blocks/global/media-carousel.html"></div>
        </section>

        <footer>
            <div data-include="blocks/global/footer.html"></div>
        </footer>

        <!-- Scroll to Top Button -->
        <div data-include="blocks/global/scroll-to-top.html"></div>

        <!-- HTML Component Loader (Handles Nested Blocks!) -->
        <script>
            async function loadComponents(container = document) {
                // Find all elements with data-include inside the given container
                const includes = container.querySelectorAll('[data-include]');
                
                for (const el of includes) {
                    const file = el.getAttribute('data-include');
                    try {
                        const response = await fetch(file);
                        if (response.ok) {
                            // Inject the HTML
                            el.innerHTML = await response.text();
                            
                            // Remove the attribute so we don't process it twice
                            el.removeAttribute('data-include');
                            
                            // RECURSION: Check if the newly injected HTML has more blocks inside it!
                            await loadComponents(el);
                        } else {
                            // el.innerHTML = `<div class="p-4 border border-red-500 text-red-500 bg-red-50">Block not found: ${file}</div>`;
                            el.removeAttribute('data-include');
                        }
                    } catch (error) {
                        console.error('Error loading component:', error);
                    }
                }
            }
            
            // Start the process when the DOM is ready
            document.addEventListener('DOMContentLoaded', () => loadComponents());
        </script>
    </body>
</html>
