<!-- blocks/widgets/activities-articles-shell.html -->
<!--
    Renders the article list + pagination for Royal/Princely Activities pages.

    Must sit inside an x-data scope providing:
      - articles: [{ img, title, date, excerpt, url? }, …]
      - articleTag (string, optional)  — category badge shown on each article
      - category (string)              — read by pagination
      - page, totalPages (numbers)     — read by pagination
-->

<div class="flex flex-col w-full">

    <template x-for="(article, idx) in articles" :key="idx">
        <article class="grid grid-cols-1 md:grid-cols-[5fr_7fr] gap-3 lg:gap-5 items-start border-b border-gray-200 pb-4 lg:pb-8 mb-4 lg:mb-8 last:border-0 last:pb-0 last:mb-0">
            <a :href="article.url || $data.defaultArticleUrl || 'article.html'"
               class="block w-full flex justify-center items-center overflow-hidden shrink-0">
                <img :src="article.img" :alt="article.title" class="h-auto w-auto max-h-[350px] max-w-full object-contain">
            </a>
            <div class="flex flex-col pt-1">
                <template x-if="$data.articleTag">
                    <span class="hero-badge text-[0.6rem] uppercase tracking-wide font-sans mb-2 self-start" x-text="$data.articleTag"></span>
                </template>
                <a :href="article.url || $data.defaultArticleUrl || 'article.html'" class="block group">
                    <h3 class="font-serif font-semibold text-[#0B1D32] text-[1.4rem] leading-snug mb-3 group-hover:text-primary transition-colors"
                        x-text="article.title"></h3>
                </a>
                <time class="text-[#9ca3af] text-[0.8rem] font-sans font-medium mb-3 block" x-text="article.date"></time>
                <p class="text-gray-600 leading-relaxed font-sans text-[0.85rem] font-normal" x-text="article.excerpt"></p>
            </div>
        </article>
    </template>

</div>

<!-- PAGINATION (reads page, totalPages, category from outer x-data) -->
<div data-include="blocks/global/pagination.html"></div>
