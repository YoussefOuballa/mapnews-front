<!-- blocks/widgets/category-news-list.html -->
<!-- 
  ALPINE JS LOGIC:
  Reads the URL parameters. 
  ?c=CategoryName sets the Title.
  ?p=PageNumber sets the active pagination state.
-->
<div class="flex flex-col w-full"
     x-data="{ 
        params: new URLSearchParams(window.location.search),
        category: 'Culture',
        page: 1,
        totalPages: 9,
        init() {
            if (this.params.get('c')) {
                this.category = this.params.get('c');
            }
            if (this.params.get('p')) {
                this.page = parseInt(this.params.get('p'));
            }
        }
     }">

    <!-- DYNAMIC PAGE TITLE -->
    <!-- x-text dynamically replaces the inner text with the URL variable -->
    <h1 class="bg-[#E8EBEE] text-[#0B1D32] font-sans font-semibold text-[0.9rem] uppercase px-4 py-1.5 
        rounded-full w-max hover:bg-gray-200 transition-colors mb-3" x-text="category"></h1>
    
    <div data-include="blocks/widgets/category-hero.html"></div>

    <div class="w-full bg-[#E8EBEE] p-2 mb-2 lg:mb-4">
        <h2 class="text-[#191919] font-bold text-xl font-serif">
            En lire plus
        </h2>
    </div>
    
    <div data-include="blocks/widgets/news-by-category.html"></div>

    <!-- ==============================================
         PART 3: REUSABLE PAGINATION
         ============================================== -->
    <div data-include="blocks/global/pagination.html"></div>

</div>
